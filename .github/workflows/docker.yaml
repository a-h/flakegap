name: Build and push Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            nix-system: x86_64-linux
            tag-suffix: amd64
          - runs-on: ubuntu-24.04-arm
            nix-system: aarch64-linux
            tag-suffix: arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build docker image
        run: nix build ".#packages.${{ matrix.nix-system }}.docker-image"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push docker image
        run: |
          docker load < result
          docker tag ghcr.io/a-h/flakegap:latest ghcr.io/a-h/flakegap:$GITHUB_REF_NAME-${{ matrix.tag-suffix }}
          docker push ghcr.io/a-h/flakegap:$GITHUB_REF_NAME-${{ matrix.tag-suffix }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/a-h/flakegap:latest \
            -t ghcr.io/a-h/flakegap:$GITHUB_REF_NAME \
            ghcr.io/a-h/flakegap:$GITHUB_REF_NAME-amd64 \
            ghcr.io/a-h/flakegap:$GITHUB_REF_NAME-arm64
